      description: |-
        * `normal` - Normal
        * `low` - Low
        * `moderate` - Moderate
        * `critical` - Critical
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - READ
      - LOGIN
      - LOGOUT
      - SUSPEND
      - REACTIVATE
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `READ` - Read
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `SUSPEND` - Suspend
        * `REACTIVATE` - Reactivate
    Admission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient_name:
          type: string
          readOnly: true
        length_of_stay_days:
          type: string
          readOnly: true
        admission_number:
          type: string
          readOnly: true
        intake_date:
          type: string
          format: date-time
        discharge_date:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AdmissionStatusEnum'
          readOnly: true
        room:
          type: string
          maxLength: 100
        bed:
          type: string
          maxLength: 100
        primary_diagnosis:
          type: string
        psychiatric_diagnosis:
          type: string
        substance_use_history: {}
        medical_history:
          type: string
        allergies: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        patient:
          type: integer
        tenant:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - admission_number
      - created_at
      - created_by
      - discharge_date
      - id
      - intake_date
      - length_of_stay_days
      - patient
      - patient_name
      - status
      - tenant
      - updated_at
    AdmissionRequest:
      type: object
      properties:
        intake_date:
          type: string
          format: date-time
        room:
          type: string
          maxLength: 100
        bed:
          type: string
          maxLength: 100
        primary_diagnosis:
          type: string
        psychiatric_diagnosis:
          type: string
        substance_use_history: {}
        medical_history:
          type: string
        allergies: {}
        patient:
          type: integer
      required:
      - intake_date
      - patient
